name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - name: Verify tests pass
        run: go test -race -count=1 ./...

      - name: Take the release notes from the changelog
        run: |
          awk -v tag="$GITHUB_REF_NAME" '
            /^## / { found = ($2 == tag); next }
            found
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $GITHUB_REF_NAME"; exit 1; }

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          body_path: notes.md
